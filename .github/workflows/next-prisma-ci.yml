name: Next.js + Prisma CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the project.
        required: false
        type: string
        default: '22'
      test-command:
        description: Unit test command. Leave empty to skip.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-not-a-real-secret
      AUTH_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Build
        run: npm run build
