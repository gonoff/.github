name: Laravel CI

on:
  workflow_call:
    inputs:
      run-migrations:
        description: Run Laravel migrations against the ephemeral SQLite database.
        required: false
        type: boolean
        default: false
      php-test-command:
        description: PHP test command. Leave empty to skip.
        required: false
        type: string
        default: ./vendor/bin/pest
      php-format-command:
        description: Read-only PHP formatting command. Leave empty to skip.
        required: false
        type: string
        default: composer lint:check
      frontend-format-command:
        description: Read-only frontend formatting command. Leave empty to skip.
        required: false
        type: string
        default: npm run format:check
      frontend-lint-command:
        description: Frontend lint command. Leave empty to skip.
        required: false
        type: string
        default: npm run lint:check
      frontend-type-command:
        description: Frontend typecheck command. Leave empty to skip.
        required: false
        type: string
        default: ''
      frontend-build-command:
        description: Frontend production build command. Leave empty to skip.
        required: false
        type: string
        default: npm run build

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Bootstrap Laravel
        shell: bash
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate

      - name: Run migrations
        if: inputs.run-migrations
        run: php artisan migrate --force

      - name: Check PHP formatting
        if: inputs.php-format-command != ''
        run: ${{ inputs.php-format-command }}

      - name: Check frontend formatting
        if: inputs.frontend-format-command != ''
        run: ${{ inputs.frontend-format-command }}

      - name: Lint frontend
        if: inputs.frontend-lint-command != ''
        run: ${{ inputs.frontend-lint-command }}

      - name: Typecheck frontend
        if: inputs.frontend-type-command != ''
        run: ${{ inputs.frontend-type-command }}

      - name: Build frontend
        if: inputs.frontend-build-command != ''
        run: ${{ inputs.frontend-build-command }}

      - name: Run PHP tests
        if: inputs.php-test-command != ''
        run: ${{ inputs.php-test-command }}
