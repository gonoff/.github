name: Node quality

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the project.
        required: false
        type: string
        default: '20'
      pnpm-version:
        description: pnpm version used by the project.
        required: false
        type: string
        default: '10.32.1'
      quality-command:
        description: Project quality command.
        required: false
        type: string
        default: pnpm check

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: ${{ inputs.quality-command }}
